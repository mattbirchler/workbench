# BenchKit's and the Mac app's tests, on pull requests that change code
# they cover. Pull requests that only touch the website, the relay, the
# iPhone app's own files or docs skip this.
#
# This repo is public, so pull requests can come from anyone. The jobs use
# no secrets and can only read the code: `pull_request` (not
# `pull_request_target`) never hands a fork's code the repo's secrets.
#
# make publish runs every suite again before a release, so a skipped run
# here can't let a bad build out.
name: Mac

on:
  pull_request:
    paths:
      - "Analytics/**"
      - "Bench/**"
      - "bench-cli/**"
      - "bench-session/**"
      - "BenchKit/**"
      - "BenchTests/**"
      - "Config/**"
      - "Makefile"
      - "project.yml"
      - "scripts/build-ghostty.sh"
      - ".github/workflows/mac.yml"
  # On main, only libghostty is built (when its version changed) and
  # cached, so pull requests can restore it instead of building it. A
  # cache made on a pull request can't be read by other pull requests.
  push:
    branches: [main]
    paths:
      - "scripts/build-ghostty.sh"
      - ".github/workflows/mac.yml"
  # A weekly touch keeps the cache from expiring: GitHub drops caches that
  # go unused for 7 days. Under a minute when the cache is there.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

env:
  # Workbench needs Xcode 27. Keep in step with the README.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  ghostty:
    name: libghostty
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Restore libghostty
        id: ghostty
        uses: actions/cache/restore@v6
        with:
          path: |
            vendor/GhosttyKit.xcframework
            vendor/ghostty-resources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}
      - name: Build libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: make ghostty
      # Saved right away, so a failing test later doesn't throw it away.
      - name: Save libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            vendor/GhosttyKit.xcframework
            vendor/ghostty-resources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}

  benchkit:
    name: BenchKit
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: swift test
        working-directory: BenchKit

  mac:
    name: Mac app
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      # Full history: the build stamps how many commits it is past the
      # last release, and a test checks that it did.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: brew install xcodegen
      - name: Restore libghostty
        id: ghostty
        uses: actions/cache/restore@v6
        with:
          path: |
            vendor/GhosttyKit.xcframework
            vendor/ghostty-resources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}
      # Only when main hasn't cached this version yet. About 15 minutes.
      - name: Build libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: make ghostty
      # Saved right away, so a failing test later doesn't throw it away.
      - name: Save libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            vendor/GhosttyKit.xcframework
            vendor/ghostty-resources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}
      # No signing team here, so the app is signed to run locally. That
      # also makes it an unofficial build: no updates, no analytics.
      - name: Sign to run locally
        run: printf 'DEVELOPMENT_TEAM =\n' > Config/Local.xcconfig
      - run: make test
      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-log
          path: build/last-test.log
